[project]
name = "dotfiles"
version = "0.1.0"
description = ""
authors = [{ name = "Janus Cheng", email = "drxaero@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0,<5",
    "ruff>=0.15.0,<0.16",
    "pytest (>=8.3.5,<9.0.0)",
    "pexpect (>=4.9.0,<5.0.0)",
    "pytest-parametrization (>=2022.2.1,<2023.0.0)",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
builtins = ["_"]

[tool.poetry-auto-export]
output = "requirements.txt"
without_hashes = true
without = ["dev"]

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
